<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laporan Keuangan – Sagara Accounting</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><h2>💼 Sagara Accounting</h2><span>Sistem Akuntansi</span></div>
    <nav class="sidebar-nav">
      <div class="nav-section">Menu Utama</div>
      <a href="/dashboard.html"><span class="nav-icon">📊</span> <span>Dashboard</span></a>
      <div class="nav-section">Akuntansi</div>
      <a href="/accounts.html"><span class="nav-icon">📒</span> <span>Bagan Akun</span></a>
      <a href="/journal.html"><span class="nav-icon">📝</span> <span>Jurnal Umum</span></a>
      <div class="nav-section">Transaksi</div>
      <a href="/sales.html"><span class="nav-icon">🛒</span> <span>Penjualan</span></a>
      <a href="/purchases.html"><span class="nav-icon">📦</span> <span>Pembelian</span></a>
      <a href="/inventory.html"><span class="nav-icon">🏪</span> <span>Persediaan</span></a>
      <div class="nav-section">Laporan</div>
      <a href="/reports.html" class="active"><span class="nav-icon">📈</span> <span>Laporan Keuangan</span></a>
    </nav>
  </aside>
  <div class="main-wrapper">
    <header class="header">
      <span class="header-title">Laporan Keuangan</span>
      <div class="header-right">
        <span class="header-user">👤 <span id="currentUser"></span></span>
        <button class="btn btn-outline btn-sm" id="logoutBtn">Keluar</button>
      </div>
    </header>
    <main class="content">
      <div class="page-header"><h1>Laporan Keuangan</h1></div>
      <!-- Report Tabs -->
      <div class="tabs">
        <button class="tab-btn active" data-report="balance-sheet">Neraca</button>
        <button class="tab-btn" data-report="income-statement">Laba Rugi</button>
        <button class="tab-btn" data-report="trial-balance">Neraca Saldo</button>
      </div>

      <!-- Date filter for income statement -->
      <div id="dateFilter" style="display:none;margin-bottom:16px" class="filters">
        <label style="font-size:13px;font-weight:600">Dari:</label>
        <input class="filter-input" id="filterFrom" type="date">
        <label style="font-size:13px;font-weight:600">Sampai:</label>
        <input class="filter-input" id="filterTo" type="date">
        <button class="btn btn-primary btn-sm" id="btnFilter">Tampilkan</button>
      </div>

      <div id="reportContent">
        <div style="text-align:center;padding:40px;color:#757575">Memuat laporan...</div>
      </div>
    </main>
  </div>
</div>

<script src="/js/main.js"></script>
<script src="/js/reports.js"></script>
</body>
</html>
