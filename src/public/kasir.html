<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mode Kasir – Sagara Meat House</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  body { margin:0; background:#1a1a2e; font-family:'Segoe UI',sans-serif; }
  .pos-layout { display:grid; grid-template-columns:1fr 380px; height:100vh; }

  /* Left: Products */
  .pos-products { display:flex; flex-direction:column; overflow:hidden; }
  .pos-header { background:#16213e; padding:12px 20px; display:flex; align-items:center; gap:14px; border-bottom:1px solid #0f3460; }
  .pos-header .logo { font-size:18px; font-weight:800; color:#e94560; white-space:nowrap; }
  .pos-header .search-box { flex:1; position:relative; }
  .pos-header .search-box input { width:100%; padding:10px 14px 10px 36px; border:2px solid #0f3460; background:#0f3460; color:#fff; border-radius:8px; font-size:14px; outline:none; }
  .pos-header .search-box input:focus { border-color:#e94560; }
  .pos-header .search-box::before { content:'🔍'; position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:14px; }
  .pos-categories { padding:10px 16px; display:flex; gap:8px; flex-wrap:wrap; background:#16213e; border-bottom:1px solid #0f3460; }
  .cat-btn { padding:6px 14px; border-radius:20px; border:1px solid #0f3460; background:transparent; color:#aaa; cursor:pointer; font-size:12px; font-weight:600; transition:all .2s; }
  .cat-btn:hover, .cat-btn.active { background:#e94560; color:#fff; border-color:#e94560; }
  .pos-grid { flex:1; overflow-y:auto; padding:16px; display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; align-content:start; }
  .pos-grid::-webkit-scrollbar { width:6px; }
  .pos-grid::-webkit-scrollbar-thumb { background:#0f3460; border-radius:3px; }
  .product-card { background:#16213e; border-radius:10px; padding:12px; cursor:pointer; transition:all .2s; border:2px solid transparent; text-align:center; }
  .product-card:hover { border-color:#e94560; transform:translateY(-2px); }
  .product-card img { width:80px; height:80px; border-radius:8px; object-fit:cover; margin-bottom:8px; background:#0f3460; }
  .product-card .p-name { font-size:13px; font-weight:600; color:#eee; margin-bottom:4px; line-height:1.3; }
  .product-card .p-price { font-size:14px; font-weight:800; color:#e94560; }
  .product-card .p-stock { font-size:11px; color:#888; margin-top:2px; }
  .product-card.out-of-stock { opacity:.4; pointer-events:none; }

  /* Right: Cart */
  .pos-cart { background:#16213e; display:flex; flex-direction:column; border-left:1px solid #0f3460; }
  .cart-header { padding:14px 18px; border-bottom:1px solid #0f3460; display:flex; justify-content:space-between; align-items:center; }
  .cart-header h3 { margin:0; color:#fff; font-size:16px; }
  .cart-header .clear-btn { background:none; border:none; color:#e94560; cursor:pointer; font-size:12px; font-weight:600; }
  .cart-customer { padding:8px 18px; border-bottom:1px solid #0f3460; }
  .cart-customer input { width:100%; padding:8px 12px; border:1px solid #0f3460; background:#0f3460; color:#fff; border-radius:6px; font-size:13px; outline:none; }
  .cart-items { flex:1; overflow-y:auto; padding:8px 14px; }
  .cart-items::-webkit-scrollbar { width:4px; }
  .cart-items::-webkit-scrollbar-thumb { background:#0f3460; border-radius:2px; }
  .cart-item { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,.05); }
  .cart-item .ci-info { flex:1; }
  .cart-item .ci-name { font-size:13px; font-weight:600; color:#eee; }
  .cart-item .ci-price { font-size:11px; color:#888; }
  .cart-item .ci-qty { display:flex; align-items:center; gap:6px; }
  .cart-item .ci-qty button { width:26px; height:26px; border-radius:6px; border:none; background:#0f3460; color:#fff; font-size:14px; cursor:pointer; font-weight:700; }
  .cart-item .ci-qty button:hover { background:#e94560; }
  .cart-item .ci-qty input { width:42px; text-align:center; border:none; background:#0f3460; color:#fff; border-radius:4px; padding:4px; font-size:13px; font-weight:600; }
  .cart-item .ci-total { font-size:13px; font-weight:700; color:#e94560; min-width:90px; text-align:right; }
  .cart-item .ci-del { background:none; border:none; color:#555; cursor:pointer; font-size:16px; padding:2px; }
  .cart-item .ci-del:hover { color:#e94560; }

  .cart-summary { padding:14px 18px; border-top:1px solid #0f3460; background:#0f3460; }
  .summary-row { display:flex; justify-content:space-between; margin-bottom:6px; font-size:13px; color:#aaa; }
  .summary-row.total { font-size:20px; font-weight:800; color:#fff; margin-top:8px; margin-bottom:12px; }
  .cart-summary .pay-row { display:flex; gap:8px; margin-bottom:8px; }
  .cart-summary .pay-row input { flex:1; padding:10px; border:1px solid #16213e; background:#16213e; color:#fff; border-radius:6px; font-size:14px; font-weight:600; text-align:right; outline:none; }
  .summary-row.change { color:#4caf50; font-weight:700; font-size:15px; }
  .btn-pay { width:100%; padding:14px; background:#e94560; color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:800; cursor:pointer; transition:all .2s; }
  .btn-pay:hover { background:#c81e45; }
  .btn-pay:disabled { background:#333; color:#666; cursor:not-allowed; }

  .cart-footer { padding:10px 18px; border-top:1px solid #0f3460; display:flex; gap:8px; }
  .cart-footer button { flex:1; padding:8px; border-radius:6px; border:none; cursor:pointer; font-size:12px; font-weight:600; }
  .btn-back { background:#0f3460; color:#aaa; }
  .btn-back:hover { color:#fff; }
  .btn-hold { background:#ff9800; color:#fff; }

  /* Receipt Modal */
  .receipt-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:1000; justify-content:center; align-items:center; }
  .receipt-overlay.show { display:flex; }
  .receipt { background:#fff; color:#333; width:320px; border-radius:10px; padding:20px; max-height:90vh; overflow-y:auto; }
  .receipt h3 { text-align:center; margin:0 0 4px; font-size:15px; }
  .receipt .r-sub { text-align:center; font-size:11px; color:#999; margin-bottom:12px; }
  .receipt table { width:100%; font-size:12px; border-collapse:collapse; margin-bottom:10px; }
  .receipt td { padding:3px 0; }
  .receipt .r-total { font-size:16px; font-weight:800; text-align:right; border-top:2px dashed #ccc; padding-top:8px; }
  .receipt .r-actions { display:flex; gap:8px; margin-top:12px; }
  .receipt .r-actions button { flex:1; padding:10px; border:none; border-radius:6px; font-weight:700; cursor:pointer; }

  .empty-cart { text-align:center; padding:40px 20px; color:#555; }
  .empty-cart .ec-icon { font-size:48px; margin-bottom:10px; }
  .empty-cart p { font-size:13px; }

  .cust-item { padding:8px 12px; cursor:pointer; font-size:13px; color:#ccc; border-bottom:1px solid rgba(255,255,255,.05); }
  .cust-item:hover { background:#0f3460; color:#fff; }
  .cust-item .ci-phone { font-size:11px; color:#666; }

  /* Keyboard shortcut hints */
  .shortcut-hints { padding:6px 18px; font-size:10px; color:#444; text-align:center; border-top:1px solid #0f3460; }

  @media (max-width:768px) {
    .pos-layout { grid-template-columns:1fr; grid-template-rows:1fr 1fr; }
  }
  @media print {
    .pos-products, .pos-cart { display:none !important; }
    .receipt-overlay { position:static; display:block !important; background:none; }
    .receipt { width:100%; box-shadow:none; margin:0; }
    .r-actions { display:none !important; }
  }
</style>
</head>
<body>
<div class="pos-layout">
  <!-- LEFT: Products -->
  <div class="pos-products">
    <div class="pos-header">
      <div class="logo">🧾 KASIR</div>
      <div class="search-box"><input id="searchProduct" placeholder="Cari produk... (F2)" autocomplete="off"></div>
      <span style="color:#888;font-size:12px" id="clockDisplay"></span>
    </div>
    <div class="pos-categories" id="categories"></div>
    <div class="pos-grid" id="productGrid"></div>
  </div>

  <!-- RIGHT: Cart -->
  <div class="pos-cart">
    <div class="cart-header">
      <h3>🛒 Keranjang</h3>
      <button class="clear-btn" onclick="clearCart()">Bersihkan</button>
    </div>
    <div class="cart-customer" style="position:relative">
      <div style="display:flex;gap:6px">
        <input id="customerName" placeholder="Ketik/pilih pelanggan..." value="Pelanggan Umum" autocomplete="off" oninput="filterCustomers()" onfocus="showCustomerList()" style="flex:1">
        <button onclick="toggleCustomerList()" style="background:#0f3460;border:1px solid #0f3460;color:#aaa;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:14px" title="Pilih pelanggan">▼</button>
      </div>
      <input id="customerAddress" placeholder="Alamat pelanggan (opsional)" style="width:100%;margin-top:6px;padding:8px 12px;border:1px solid #0f3460;background:#0f3460;color:#fff;border-radius:6px;font-size:13px;outline:none" autocomplete="off">
      <div id="customerDropdown" style="display:none;position:absolute;top:100%;left:0;right:0;background:#16213e;border:1px solid #0f3460;border-radius:0 0 8px 8px;max-height:200px;overflow-y:auto;z-index:100">
        <div id="customerList"></div>
        <div style="border-top:1px solid #0f3460;padding:8px 12px">
          <button onclick="addNewCustomer()" style="width:100%;padding:6px;background:#e94560;color:#fff;border:none;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer">+ Tambah Pelanggan Baru</button>
        </div>
      </div>
      <div id="customerInfo" style="font-size:11px;color:#666;padding:2px 4px;display:none"></div>
    </div>
    <div class="cart-items" id="cartItems">
      <div class="empty-cart"><div class="ec-icon">🛒</div><p>Keranjang kosong<br>Klik produk untuk menambahkan</p></div>
    </div>
    <div class="cart-summary">
      <div class="summary-row"><span>Subtotal</span><span id="subtotalDisplay">Rp 0</span></div>
      <div class="summary-row"><span>Diskon</span><span><input id="discountInput" type="text" inputmode="decimal" value="0" style="width:80px;padding:4px 8px;background:#16213e;border:1px solid #16213e;color:#fff;border-radius:4px;text-align:right;font-size:12px" oninput="this.value=this.value.replace(/,/g,'.');updateSummary()"></span></div>
      <div class="summary-row total"><span>TOTAL</span><span id="totalDisplay">Rp 0</span></div>
      <div style="display:flex;gap:6px;margin-bottom:10px">
        <button class="pay-type-btn active" id="btnCash" onclick="setPayType('CASH')" style="flex:1;padding:8px;border-radius:6px;border:2px solid #4caf50;background:#4caf50;color:#fff;font-weight:700;cursor:pointer;font-size:13px">💵 CASH</button>
        <button class="pay-type-btn" id="btnHutang" onclick="setPayType('HUTANG')" style="flex:1;padding:8px;border-radius:6px;border:2px solid #ff9800;background:transparent;color:#ff9800;font-weight:700;cursor:pointer;font-size:13px">📋 HUTANG</button>
      </div>
      <div id="cashSection">
        <div class="pay-row">
          <input id="payAmount" placeholder="Bayar (F4)" type="text" inputmode="decimal" oninput="this.value=this.value.replace(/,/g,'.');updateSummary()">
        </div>
        <div class="summary-row change"><span>Kembalian</span><span id="changeDisplay">Rp 0</span></div>
      </div>
      <div id="hutangSection" style="display:none">
        <div style="font-size:12px;color:#ff9800;margin-bottom:6px">⚠ Pembayaran hutang — akan dicatat sebagai piutang pelanggan</div>
        <div class="pay-row">
          <input id="dpAmount" placeholder="Uang muka / DP (opsional)" type="text" inputmode="decimal" value="0" oninput="this.value=this.value.replace(/,/g,'.');updateSummary()" style="flex:1;padding:10px;border:1px solid #16213e;background:#16213e;color:#fff;border-radius:6px;font-size:14px;font-weight:600;text-align:right;outline:none">
        </div>
        <div class="summary-row" style="color:#ff9800"><span>Sisa Hutang</span><span id="hutangDisplay">Rp 0</span></div>
      </div>
      <button class="btn-pay" id="btnPay" disabled onclick="processPayment()">💳 BAYAR (F8)</button>
    </div>
    <div class="cart-footer">
      <button class="btn-back" onclick="window.location.href='/sales.html'">← Kembali</button>
      <button class="btn-hold" onclick="holdTransaction()">⏸ Tahan</button>
    </div>
    <div class="shortcut-hints">F2: Cari | F4: Bayar | F8: Proses | ESC: Batal</div>
  </div>
</div>

<!-- Receipt Modal -->
<div class="receipt-overlay" id="receiptModal">
  <div class="receipt" id="receiptContent"></div>
</div>

<script src="/js/main.js"></script>
<script src="/js/kasir.js"></script>
</body>
</html>
