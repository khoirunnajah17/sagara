<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login – Sagara Accounting</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <h1>💼 Sagara</h1>
      <p>Sistem Akuntansi Bisnis Anda</p>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input class="form-control" id="username" type="text" placeholder="Masukkan username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input class="form-control" id="password" type="password" placeholder="Masukkan password" required autocomplete="current-password">
      </div>
      <p id="errMsg" style="color:#e53935;font-size:13px;margin-bottom:10px;display:none"></p>
      <button class="btn btn-primary" style="width:100%;justify-content:center;padding:10px" type="submit">Masuk</button>
    </form>
    <p style="text-align:center;margin-top:16px;font-size:12px;color:#757575">
      Default: <strong>admin</strong> / <strong>Admin@1234</strong>
    </p>
  </div>
</div>
<script>
(async () => {
    try {
        const r = await fetch('/api/auth/me', { credentials: 'include' });
        const d = await r.json();
        if (d.success) window.location.href = '/dashboard.html';
    } catch {}
})();

document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const errMsg = document.getElementById('errMsg');
    errMsg.style.display = 'none';
    const body = { username: document.getElementById('username').value, password: document.getElementById('password').value };
    try {
        const res  = await fetch('/api/auth/login', {
            method: 'POST', credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.success) { window.location.href = '/dashboard.html'; }
        else { errMsg.textContent = data.message; errMsg.style.display = 'block'; }
    } catch {
        errMsg.textContent = 'Tidak dapat terhubung ke server.';
        errMsg.style.display = 'block';
    }
});
</script>
</body>
</html>
