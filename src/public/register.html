<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Daftar – Sagara Meat House</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-page">
  <div class="login-card" style="max-width:420px">
    <div class="login-logo">
      <img src="/api/logo" alt="Logo" class="login-logo-img">
      <h1>Sagara Meat House</h1>
      <p>Daftar Akun Pelanggan</p>
    </div>
    <form id="registerForm">
      <div class="form-group">
        <label>Nama Lengkap *</label>
        <input class="form-control" id="regName" placeholder="Nama lengkap" required>
      </div>
      <div class="form-group">
        <label>No. HP *</label>
        <input class="form-control" id="regPhone" type="tel" placeholder="08xxxxxxxxxx" required>
      </div>
      <div class="form-group">
        <label>Email (opsional)</label>
        <input class="form-control" id="regEmail" type="email" placeholder="email@contoh.com">
      </div>
      <div class="form-group">
        <label>Password * (min 6 karakter)</label>
        <input class="form-control" id="regPassword" type="password" placeholder="Buat password" required>
      </div>
      <p id="errMsg" style="color:#e53935;font-size:13px;margin-bottom:10px;display:none"></p>
      <div id="successMsg" style="display:none;text-align:center;padding:10px 0">
        <div style="font-size:42px;margin-bottom:8px">✅</div>
        <h3 style="color:#2e7d32;margin-bottom:6px">Pendaftaran Berhasil!</h3>
        <p style="color:var(--text-muted);font-size:13px;margin-bottom:14px">Akun Anda menunggu verifikasi admin.<br>Silakan login setelah akun diverifikasi.</p>
        <a href="/index.html" class="btn btn-primary" style="padding:8px 24px;text-decoration:none">Ke Halaman Login</a>
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;padding:10px" type="submit" id="btnRegister">Daftar</button>
    </form>
    <p style="text-align:center;margin-top:16px;font-size:13px;color:var(--text-muted)">
      Sudah punya akun? <a href="/index.html" style="color:var(--primary);font-weight:600">Masuk</a>
    </p>
    <p style="text-align:center;margin-top:8px;font-size:11px;color:#999">
      <a href="/" style="color:#999;text-decoration:none">← Kembali ke Beranda</a>
    </p>
  </div>
</div>
<script>
document.getElementById('registerForm').addEventListener('submit', async e => {
    e.preventDefault();
    const errMsg = document.getElementById('errMsg');
    errMsg.style.display = 'none';
    const name = document.getElementById('regName').value.trim();
    const phone = document.getElementById('regPhone').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;

    if (!name || !phone || !password) { errMsg.textContent = 'Nama, No. HP, dan password wajib diisi.'; errMsg.style.display = 'block'; return; }
    if (password.length < 6) { errMsg.textContent = 'Password minimal 6 karakter.'; errMsg.style.display = 'block'; return; }

    try {
        const res = await fetch('/api/customer-auth/register', {
            method: 'POST', credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, phone, email, password })
        });
        const data = await res.json();
        if (!data.success) { errMsg.textContent = data.message; errMsg.style.display = 'block'; return; }
        document.getElementById('successMsg').style.display = 'block';
        document.getElementById('btnRegister').style.display = 'none';
        document.querySelectorAll('#registerForm .form-group').forEach(g => g.style.display = 'none');
    } catch {
        errMsg.textContent = 'Tidak dapat terhubung ke server.';
        errMsg.style.display = 'block';
    }
});
</script>
</body>
</html>
