name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: sagara_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptestpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Import database schema
        run: |
          mysql -h 127.0.0.1 -u root -ptestpassword sagara_test < database.sql

      - name: Smoke test – server starts
        env:
          PORT: 3000
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: testpassword
          DB_NAME: sagara_test
          SESSION_SECRET: ci_secret_test
        run: |
          node index.js &
          SERVER_PID=$!
          sleep 3
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/)
          kill $SERVER_PID
          echo "HTTP Status: $STATUS"
          [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ] || { echo "Server returned unexpected status $STATUS"; exit 1; }

      - name: Login API test
        env:
          PORT: 3000
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: testpassword
          DB_NAME: sagara_test
          SESSION_SECRET: ci_secret_test
        run: |
          node index.js &
          SERVER_PID=$!
          sleep 3
          RESULT=$(curl -s -X POST http://localhost:3000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"Admin@1234"}')
          kill $SERVER_PID
          echo "Login result: $RESULT"
          echo "$RESULT" | grep -q '"success":true' || { echo "Login failed"; exit 1; }
          echo "Login API test passed ✅"
